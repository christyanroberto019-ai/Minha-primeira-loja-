
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eeeeee;
      text-align: center;
      margin: 0;
    }

    header {
      background: #142850;
      color: white;
      padding: 20px;
    }

    .produtos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 12px;
    }

    .produto {
      background: white;
      padding: 12px;
      border-radius: 12px;
    }

    img {
      width: 100%;
      border-radius: 8px;
    }

    button {
      background: green;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Minha Loja</h1>
    <p>Estilo e qualidade para você!</p>
  </header>

  <main class="produtos">
    <div class="produto">
      <h2>Camiseta</h2>
      <img src="https://placehold.co/300x200?text=Camiseta"
           alt="Imagem ilustrativa de camiseta">
      <p>Preço: R$ 50,00</p>
      <button onclick="alert('Obrigado pelo interesse!')">
        Ver produto
      </button>
    </div>

    <div class="produto">
      <h2>Tênis</h2>
      <img src="https://placehold.co/300x200?text=Tenis"
           alt="Imagem ilustrativa de tênis">
      <p>Preço: R$ 120,00</p>
      <button onclick="alert('Obrigado pelo interesse!')">
        Ver produto
      </button>
    </div>
  </main>
</body>
</html>
